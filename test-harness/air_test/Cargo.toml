[package]
name = "air_test_harness"
version = "0.1.0"
edition = "2021"

[dependencies]
# The real, unmodified production crate -- not a copy, not a `#[path]`
# trick. This harness now requires network access to crates.io and a
# recent enough toolchain (edition2024 transitive deps) to build; see
# ../README.md.
title_air = { path = "../../air" }
winterfell = { version = "0.13.1", default-features = false, features = ["std"] }

[[bin]]
name = "e2e_harness"
path = "src/bin/e2e_harness.rs"

[[bin]]
name = "fuzz_harness"
path = "src/bin/fuzz_harness.rs"
